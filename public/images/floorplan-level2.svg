<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#F8F6F1; font-family:'Plus Jakarta Sans',sans-serif;">
  <defs>
    <pattern id="gridPattern2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E9E0D4" stroke-width="0.5"/>
    </pattern>
    <pattern id="terracePavers" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F4EFEA"/>
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#E0D7CC" stroke-width="0.5"/>
    </pattern>
    <style>
      .wall { stroke: #24231F; stroke-width: 3.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .inner-wall { stroke: #24231F; stroke-width: 2; fill: none; }
      .window { stroke: #A58B69; stroke-width: 2; fill: #FFFFFF; fill-opacity: 0.7; }
      .room-zone { fill: transparent; transition: fill 0.3s ease; cursor: pointer; }
      .room-zone:hover { fill: rgba(165, 139, 105, 0.12); }
      .label-title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: #24231F; text-transform: uppercase; }
      .label-sub { font-size: 11px; fill: #7A756D; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace; }
      .dim-line { stroke: #C8B9A5; stroke-width: 1; stroke-dasharray: 2 2; }
      .hotspot { fill: #A58B69; cursor: pointer; transition: transform 0.2s ease, fill 0.2s ease; }
      .hotspot:hover { fill: #24231F; transform: scale(1.2); }
    </style>
  </defs>

  <rect width="1000" height="650" fill="#F8F6F1"/>
  <rect x="50" y="50" width="900" height="550" fill="url(#gridPattern2)" opacity="0.6"/>

  <!-- Compass Rose -->
  <g transform="translate(910, 90)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C8B9A5" stroke-width="1"/>
    <path d="M 0 -22 L 4 -4 L 0 0 L -4 -4 Z" fill="#24231F"/>
    <path d="M 0 22 L 4 4 L 0 0 L -4 4 Z" fill="#C8B9A5"/>
    <text x="0" y="-26" text-anchor="middle" font-size="10" font-weight="700" fill="#24231F">N</text>
  </g>

  <!-- SKY TERRACE AREA (Top half) -->
  <rect x="90" y="90" width="820" height="220" fill="url(#terracePavers)"/>
  
  <!-- Interactive Terrace Zone -->
  <g class="room-zone" data-room="terrace">
    <rect x="90" y="90" width="820" height="220"/>
    <text x="500" y="160" text-anchor="middle" class="label-title">PRIVATE SKY TERRACE &amp; PERGOLA LOGGIA</text>
    <text x="500" y="180" text-anchor="middle" class="label-sub">240 m² · PANORAMIC CITY &amp; EIFFEL VIEWS · PIET OUDOLF PLANTING</text>
  </g>

  <!-- Heated Infinity Plunge Pool -->
  <g transform="translate(130, 115)">
    <rect width="210" height="75" fill="#DCE7E9" stroke="#A58B69" stroke-width="1.5" rx="2"/>
    <text x="105" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#3D5A60" letter-spacing="0.1em">HEATED INFINITY POOL (8.5m × 3.0m)</text>
  </g>

  <!-- Outdoor Loungers Area -->
  <g transform="translate(720, 120)">
    <rect width="140" height="65" fill="none" stroke="#C8B9A5" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="38" text-anchor="middle" font-size="10" fill="#7A756D">SUNSET LOUNGE</text>
  </g>

  <!-- INTERIOR LEVEL 02 (Bottom half: Master Penthouse Suite, Spa Bath, Dressing, Study) -->
  <!-- 1. Master Bedroom Suite -->
  <g class="room-zone" data-room="master">
    <rect x="90" y="310" width="410" height="250"/>
    <text x="295" y="420" text-anchor="middle" class="label-title">PRIMARY PENTHOUSE SUITE</text>
    <text x="295" y="440" text-anchor="middle" class="label-sub">10.80m × 6.80m · 74 m² · DUAL EXPOSURE</text>
  </g>

  <!-- 2. Master Spa Bath -->
  <g class="room-zone" data-room="spa">
    <rect x="500" y="310" width="220" height="250"/>
    <text x="610" y="420" text-anchor="middle" class="label-title">SPA EN-SUITE</text>
    <text x="610" y="440" text-anchor="middle" class="label-sub">5.80m × 4.60m · 27 m² · STONE TUB &amp; SAUNA</text>
  </g>

  <!-- 3. Private Study / Dressing Salon -->
  <g class="room-zone" data-room="study">
    <rect x="720" y="310" width="190" height="250"/>
    <text x="815" y="420" text-anchor="middle" class="label-title">DRESSING &amp; ATELIER</text>
    <text x="815" y="440" text-anchor="middle" class="label-sub">4.80m × 4.20m · 21 m²</text>
  </g>

  <!-- WALLS -->
  <polygon points="90,90 910,90 910,560 90,560" class="wall"/>
  <line x1="90" y1="310" x2="910" y2="310" class="wall"/>
  <line x1="500" y1="310" x2="500" y2="560" class="inner-wall"/>
  <line x1="720" y1="310" x2="720" y2="560" class="inner-wall"/>

  <!-- Glazing between Penthouse Suite and Sky Terrace -->
  <rect x="110" y="307" width="370" height="6" class="window"/>
  <rect x="520" y="307" width="180" height="6" class="window"/>
  <rect x="740" y="307" width="150" height="6" class="window"/>

  <!-- Master Bed & Travertine Tub Graphics -->
  <rect x="235" y="465" width="120" height="85" fill="#E9E0D4" stroke="#A58B69" stroke-width="1.2" rx="4"/>
  <rect x="575" y="480" width="70" height="40" fill="#FFFFFF" stroke="#24231F" stroke-width="1.5" rx="18"/>

  <!-- Interactive Hotspots -->
  <g class="hotspot" data-room="terrace" transform="translate(420, 120)">
    <circle cx="0" cy="0" r="10" fill="#A58B69"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#FFFFFF" font-weight="bold">4</text>
  </g>

  <g class="hotspot" data-room="master" transform="translate(160, 360)">
    <circle cx="0" cy="0" r="10" fill="#A58B69"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#FFFFFF" font-weight="bold">5</text>
  </g>

  <g class="hotspot" data-room="spa" transform="translate(610, 360)">
    <circle cx="0" cy="0" r="10" fill="#A58B69"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#FFFFFF" font-weight="bold">6</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(90, 600)">
    <text x="0" y="-8" font-size="10" letter-spacing="0.1em" fill="#7A756D">ARCHITECTURAL SCALE 1:100 (METERS)</text>
    <line x1="0" y1="0" x2="200" y2="0" stroke="#24231F" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#24231F" stroke-width="1.5"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#24231F" stroke-width="1"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#24231F" stroke-width="1.5"/>
    <line x1="150" y1="-3" x2="150" y2="3" stroke="#24231F" stroke-width="1"/>
    <line x1="200" y1="-4" x2="200" y2="4" stroke="#24231F" stroke-width="1.5"/>
    <text x="0" y="14" font-size="9" fill="#24231F">0m</text>
    <text x="100" y="14" font-size="9" fill="#24231F">5m</text>
    <text x="200" y="14" font-size="9" fill="#24231F">10m</text>
  </g>

  <!-- Level 02 Title Badge -->
  <g transform="translate(730, 600)">
    <text x="180" y="-4" text-anchor="end" font-size="11" font-weight="600" letter-spacing="0.15em" fill="#24231F">LEVEL 02 · MASTER PENTHOUSE &amp; SKY LOGGIA</text>
    <text x="180" y="12" text-anchor="end" font-size="9" fill="#A58B69" font-family="'JetBrains Mono', monospace">INTERIOR: 260 M² · PRIVATE TERRACE: 240 M²</text>
  </g>
</svg>
